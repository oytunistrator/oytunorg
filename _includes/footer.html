<!-- The Footer -->

<footer>
    <div class="container px-lg-4">
      <div class="d-flex justify-content-center align-items-center text-muted mx-md-3">
        <p>
          {{- '©' }}
          {{ 'now' | date: '%Y' }}
          <a href="{{ site.social.links[0] }}">{{ site.social.name }}</a>.
          {% if site.data.locales[include.lang].copyright.brief %}
            <span
              data-bs-toggle="tooltip"
              data-bs-placement="top"
              title="{{ site.data.locales[include.lang].copyright.verbose }}"
            >
              {{- site.data.locales[include.lang].copyright.brief -}}
            </span>
          {% endif %}
        </p>
      </div>
    </div>
  </footer>

  <button
    type="button"
    class="theme-toggle"
    id="theme-toggle"
    aria-label="Switch to dark mode"
    aria-pressed="false"
    title="Switch to dark mode"
  >
    <i class="fas fa-moon" aria-hidden="true"></i>
  </button>

  <style>
    footer p:last-child::before {
      content: "";
    }

    .theme-toggle {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 1030;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      border: 1px solid var(--btn-backtotop-border-color);
      border-radius: 50%;
      color: var(--btn-backtotop-color);
      background: var(--button-bg);
      box-shadow: 0 0.25rem 0.9rem rgb(0 0 0 / 12%);
      font-size: 1rem;
      cursor: pointer;
      transition: color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .theme-toggle:hover,
    .theme-toggle:focus-visible,
    #back-to-top:hover {
      color: var(--link-color);
      box-shadow: 0 0.35rem 1rem rgb(0 0 0 / 18%);
      transform: translateY(-2px);
    }

    .theme-toggle:focus-visible,
    #back-to-top:focus-visible {
      outline: 2px solid var(--link-color);
      outline-offset: 3px;
    }

    #back-to-top {
      right: 1.25rem;
      bottom: calc(1.25rem + 2.75rem + 0.75rem);
    }

    #sidebar .sidebar-bottom {
      display: flex !important;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 0.65rem;
      padding: 0 1rem;
    }

    #sidebar .sidebar-bottom .icon-border {
      display: none;
    }

    #sidebar .sidebar-bottom #mode-toggle,
    #sidebar .sidebar-bottom a {
      margin: 0 !important;
    }

    @media (max-width: 576px) {
      .theme-toggle {
        right: 0.75rem;
        bottom: 0.75rem;
      }

      #back-to-top {
        right: 0.75rem;
        bottom: calc(0.75rem + 2.75rem + 0.75rem);
      }
    }
  </style>

  <script>
    (() => {
      const toggle = document.getElementById('theme-toggle');
      const root = document.documentElement;
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      if (!toggle) return;

      const getTheme = () => {
        if (typeof Theme !== 'undefined') {
          if ('resolvedTheme' in Theme) return Theme.resolvedTheme;
          if ('visualState' in Theme) return Theme.visualState;
        }

        return (
          root.getAttribute('data-bs-theme') ||
          root.getAttribute('data-mode') ||
          (systemTheme.matches ? 'dark' : 'light')
        );
      };

      const updateToggle = () => {
        const dark = getTheme() === 'dark';
        const label = dark ? 'Switch to light mode' : 'Switch to dark mode';
        toggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
        toggle.setAttribute('aria-label', label);
        toggle.setAttribute('title', label);
        toggle.querySelector('i').className = dark ? 'fas fa-sun' : 'fas fa-moon';
      };

      updateToggle();
      const modeToggle = document.getElementById('mode-toggle');
      if (modeToggle) {
        modeToggle.addEventListener('click', () => window.setTimeout(updateToggle, 0));
      }

      new MutationObserver(updateToggle).observe(root, {
        attributes: true,
        attributeFilter: ['data-bs-theme', 'data-mode']
      });

      toggle.addEventListener('click', () => {
        const nextTheme = getTheme() === 'dark' ? 'light' : 'dark';

        if (typeof Theme !== 'undefined' && 'update' in Theme) {
          Theme.update(nextTheme);
        } else if (typeof Theme !== 'undefined' && 'flip' in Theme) {
          Theme.flip();
        } else {
          root.setAttribute('data-bs-theme', nextTheme);
          root.setAttribute('data-mode', nextTheme);
          localStorage.setItem('theme', nextTheme);
          sessionStorage.setItem('mode', nextTheme);
        }

        updateToggle();
      });

      systemTheme.addEventListener('change', () => {
        updateToggle();
      });
    })();
  </script>
