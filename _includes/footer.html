<!-- The Footer -->

<footer>
    <div class="container px-lg-4">
      <div class="d-flex justify-content-center align-items-center text-muted mx-md-3">
        <p>
          {{- '©' }}
          {{ 'now' | date: '%Y' }}
          <a href="{{ site.social.links[0] }}">{{ site.social.name }}</a>.
          {% if site.data.locales[include.lang].copyright.brief %}
            <span
              data-bs-toggle="tooltip"
              data-bs-placement="top"
              title="{{ site.data.locales[include.lang].copyright.verbose }}"
            >
              {{- site.data.locales[include.lang].copyright.brief -}}
            </span>
          {% endif %}
        </p>
      </div>
    </div>
  </footer>

  <button
    type="button"
    class="theme-toggle"
    id="theme-toggle"
    aria-label="Switch to dark mode"
    aria-pressed="false"
  >
    <i class="fas fa-moon" aria-hidden="true"></i>
    <span>Dark mode</span>
  </button>

  <style>
    footer p:last-child::before{
        content: "";
    }

    .theme-toggle {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 1030;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 0.9rem;
      border: 1px solid var(--sidebar-border-color);
      border-radius: 999px;
      color: var(--text-color);
      background: var(--card-bg);
      box-shadow: 0 0.25rem 0.9rem rgb(0 0 0 / 12%);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .theme-toggle:hover,
    .theme-toggle:focus-visible {
      color: var(--link-color);
      box-shadow: 0 0.35rem 1rem rgb(0 0 0 / 18%);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--link-color);
      outline-offset: 2px;
    }

    @media (max-width: 576px) {
      .theme-toggle {
        right: 0.75rem;
        bottom: 0.75rem;
        padding: 0.7rem;
      }

      .theme-toggle span {
        display: none;
      }
    }
  </style>

  <script>
    (() => {
      const toggle = document.getElementById('theme-toggle');
      const root = document.documentElement;
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      if (!toggle) return;

      const getTheme = () => {
        if (typeof Theme !== 'undefined') {
          if ('resolvedTheme' in Theme) return Theme.resolvedTheme;
          if ('visualState' in Theme) return Theme.visualState;
        }

        return (
          root.getAttribute('data-bs-theme') ||
          root.getAttribute('data-mode') ||
          (systemTheme.matches ? 'dark' : 'light')
        );
      };

      const updateToggle = () => {
        const dark = getTheme() === 'dark';
        toggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
        toggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        toggle.querySelector('i').className = dark ? 'fas fa-sun' : 'fas fa-moon';
        toggle.querySelector('span').textContent = dark ? 'Light mode' : 'Dark mode';
      };

      updateToggle();
      toggle.addEventListener('click', () => {
        const nextTheme = getTheme() === 'dark' ? 'light' : 'dark';

        if (typeof Theme !== 'undefined' && 'update' in Theme) {
          Theme.update(nextTheme);
        } else if (typeof Theme !== 'undefined' && 'flip' in Theme) {
          Theme.flip();
        } else {
          root.setAttribute('data-bs-theme', nextTheme);
          root.setAttribute('data-mode', nextTheme);
          localStorage.setItem('theme', nextTheme);
          sessionStorage.setItem('mode', nextTheme);
        }

        updateToggle();
      });

      systemTheme.addEventListener('change', () => {
        updateToggle();
      });
    })();
  </script>
