<footer>
    <div class="container px-lg-4">
      <div class="d-flex justify-content-center align-items-center text-muted mx-md-3">
        <p>
          {{- '©' }}
          {{ 'now' | date: '%Y' }}
          <a href="{{ site.social.links[0] }}">{{ site.social.name }}</a>.
          {% if site.data.locales[include.lang].copyright.brief %}
            <span
              data-bs-toggle="tooltip"
              data-bs-placement="top"
              title="{{ site.data.locales[include.lang].copyright.verbose }}"
            >
              {{- site.data.locales[include.lang].copyright.brief -}}
            </span>
          {% endif %}
        </p>
      </div>
    </div>
  </footer>

  <button
    type="button"
    class="theme-toggle"
    id="theme-toggle"
    aria-label="Switch to dark mode"
    aria-pressed="false"
    title="Switch to dark mode"
  >
    <i class="fas fa-moon" aria-hidden="true"></i>
  </button>

  <script>
    (() => {
      const toggle = document.getElementById('theme-toggle');
      const root = document.documentElement;
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      if (!toggle) return;

      const getTheme = () => {
        if (typeof Theme !== 'undefined') {
          if ('resolvedTheme' in Theme) return Theme.resolvedTheme;
          if ('visualState' in Theme) return Theme.visualState;
        }

        return (
          root.getAttribute('data-bs-theme') ||
          root.getAttribute('data-mode') ||
          (systemTheme.matches ? 'dark' : 'light')
        );
      };

      const updateToggle = () => {
        const dark = getTheme() === 'dark';
        const label = dark ? 'Switch to light mode' : 'Switch to dark mode';
        toggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
        toggle.setAttribute('aria-label', label);
        toggle.setAttribute('title', label);
        toggle.querySelector('i').className = dark ? 'fas fa-sun' : 'fas fa-moon';
      };

      updateToggle();
      toggle.addEventListener('click', () => {
        const nextTheme = getTheme() === 'dark' ? 'light' : 'dark';

        if (typeof Theme !== 'undefined' && 'update' in Theme) {
          Theme.update(nextTheme);
        } else if (typeof Theme !== 'undefined' && 'flip' in Theme) {
          Theme.flip();
        } else {
          root.setAttribute('data-bs-theme', nextTheme);
          root.setAttribute('data-mode', nextTheme);
          localStorage.setItem('theme', nextTheme);
          sessionStorage.setItem('mode', nextTheme);
        }

        updateToggle();
      });

      systemTheme.addEventListener('change', () => {
        updateToggle();
      });
    })();
  </script>
